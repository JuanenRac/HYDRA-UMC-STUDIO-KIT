<title id="t">HYDRA-UMC-STUDIO-KIT architecture</title>
<desc id="d">HYDRA-UMC-STUDIO-KIT is a package with no framework and no runtime dependencies. A web client creates a session, an HTTP client that uses it, and the stores for its history, preferences and tours; the kit talks to the storage of the browser and to the server, and nothing else.</desc>
